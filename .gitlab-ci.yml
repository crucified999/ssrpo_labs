image: ubuntu:24.04

stages:
  - compile
  - test
  - delivery

variables:
  DEBIAN_FRONTEND: noninteractive
  TZ: Europe/Moscow

before_script:
  - apt-get update
  - apt-get install -y --no-install-recommends g++ make

build-code:
  stage: compile
  script:
    - ./configure
    - make -j2
  artifacts:
    paths:
      - bin/lab
    expire_in: 1 week

test-all:
  stage: test
  script:
    - make coverage
  coverage: '/TOTAL line coverage: \d+\.\d+%/'
  artifacts:
    when: always
    paths:
      - coverage/
    expire_in: 1 week

pages:
  stage: delivery
  script:
    - apt-get install -y --no-install-recommends doxygen graphviz lcov
    - make coverage
    - doxygen doc/Doxyfile.cfg
    - lcov --capture --directory build --output-file coverage/lab.info --rc branch_coverage=0 --ignore-errors mismatch
    - lcov --extract coverage/lab.info "$CI_PROJECT_DIR/src/*" "$CI_PROJECT_DIR/include/*" --output-file coverage/project.info
    - genhtml coverage/project.info --output-directory coverage/html
    - mkdir -p public
    - cp -R doc/html/. public/
    - cp -R coverage/html public/coverage
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

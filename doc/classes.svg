<text x="40" y="1491" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#203147">Сплошная линия с треугольником — наследование; пунктир с треугольником — реализация интерфейса.</text>
<text x="40" y="1520" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#203147">Ромб — владение / агрегация; стрелка — использование. Детали стандартной библиотеки сокращены.</text>
